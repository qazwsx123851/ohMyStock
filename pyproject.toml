[project]
name = "ohmystock"
version = "0.0.0"
description = "ohMyStock — Taiwan stock paper-trading agent (Phase 0a scaffold)"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "pydantic-settings>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "shioaji>=1.2",
    "anthropic>=0.40",
    "twstock>=1.3",
    "yfinance>=0.2",
]

[project.scripts]
ohmystock = "ohmystock.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ohmystock"]

[tool.uv]
# placeholder; tighten as deps grow

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
