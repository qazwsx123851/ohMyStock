[project]
name = "ohmystock"
version = "0.0.0"
description = "ohMyStock — Taiwan stock paper-trading agent (Phase 0a scaffold)"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ohmystock = "ohmystock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ohmystock"]

[tool.uv]
# placeholder; tighten as deps grow

[tool.pytest.ini_options]
testpaths = ["tests"]
